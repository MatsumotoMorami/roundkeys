[package]
name = "roundkeys"
version = "0.1.1"
edition = "2024"
description = "Rounded 7-key and scratch input visualizer with an OBS browser source"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "__screenshot"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_HumanInterfaceDevice", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_IO", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

